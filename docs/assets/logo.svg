<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#grad1)" />

  <!-- Left node (client) -->
  <circle cx="55" cy="100" r="22" fill="white" opacity="0.9" />
  <text x="55" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#6366f1">AI</text>

  <!-- Right node (provider) -->
  <circle cx="145" cy="100" r="22" fill="white" opacity="0.9" />
  <text x="145" y="105" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="bold" fill="#6366f1">LLM</text>

  <!-- Bridge connection -->
  <path d="M 77 100 L 123 100" stroke="white" stroke-width="6" stroke-linecap="round" opacity="0.9" />

  <!-- Bridge arch -->
  <path d="M 77 100 Q 100 70 123 100" stroke="white" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.6" />

  <!-- Signal dots on bridge -->
  <circle cx="90" cy="92" r="4" fill="white" opacity="0.8" />
  <circle cx="100" cy="85" r="4" fill="white" opacity="0.8" />
  <circle cx="110" cy="92" r="4" fill="white" opacity="0.8" />
</svg>
